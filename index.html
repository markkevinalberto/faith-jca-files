<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Faith JCA Files</title>
<meta name="description" content="Slide decks for Life and Career Skills, by Ms. Faith Alberto.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500..700&family=Hanken+Grotesk:wght@400..700&display=swap">
<style>
:root{--paper:#F5EFE4;--core:#FFFCF6;--ink:#1B2430;--ink2:#434D5B;--ink3:#7A8290;--rule:rgba(27,36,48,.12);--accent:#C9402A;--teal:#1F7C78}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#111922;--core:#1B2633;--ink:#F5EFE4;--ink2:#CFC8BA;--ink3:#8D95A2;--rule:rgba(245,239,228,.14);--accent:#FF8C70;--teal:#6DD5CE}}
:root[data-theme="dark"]{--paper:#111922;--core:#1B2633;--ink:#F5EFE4;--ink2:#CFC8BA;--ink3:#8D95A2;--rule:rgba(245,239,228,.14);--accent:#FF8C70;--teal:#6DD5CE}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:var(--paper);color:var(--ink);font:17px/1.5 "Hanken Grotesk",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:64px 16px 48px}
.tag{display:inline-block;padding:6px 14px;border-radius:999px;border:1px solid var(--rule);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
h1{font:650 clamp(40px,8vw,64px)/1.02 "Newsreader",Georgia,serif;letter-spacing:-.02em;margin:18px 0 10px}
p.lead{color:var(--ink2);margin:0 0 40px;font-size:19px}
h2{font:600 14px/1 "Hanken Grotesk",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:0 0 14px}
a.deck{display:flex;align-items:center;gap:18px;padding:20px 22px;border-radius:22px;background:var(--core);border:1px solid var(--rule);color:inherit;text-decoration:none;transition:transform .5s cubic-bezier(.32,.72,0,1),box-shadow .5s cubic-bezier(.32,.72,0,1)}
a.deck:hover{transform:translateY(-3px);box-shadow:0 24px 40px -28px rgba(0,0,0,.45)}
a.deck .n{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--accent);color:#fff;font:700 24px/1 "Newsreader",serif}
a.deck b{display:block;font:650 21px/1.2 "Newsreader",serif}a.deck span{color:var(--ink2);font-size:15px}
a.deck .go{margin-left:auto;flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--rule);color:var(--teal)}
footer{margin-top:48px;color:var(--ink3);font-size:14px}
</style>
</head>
<body><main>
<span class="tag">Life and Career Skills · Grade 11</span>
<h1>Faith JCA Files</h1>
<p class="lead">Slide decks for class. Open a lesson to review it on your phone or laptop.</p>
<h2>Lessons</h2>
<a class="deck" href="lesson-2/"><span class="n">2</span><div><b>Understanding Workplace Considerations for Career Success</b><span>Rights of employees and occupational wellness</span></div><span class="go" aria-hidden="true">&rarr;</span></a>
<footer>Ms. Faith Desiree C. Alberto · JCSGO Christian Academy</footer>
</main></body>
</html>
